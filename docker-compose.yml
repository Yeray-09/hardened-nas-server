services:
  db:
    image: mariadb:10.11
    container_name: nextcloud-db
    restart: always
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    volumes:
      - db_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=MiContrasenaSeguraRoot123!
      - MYSQL_PASSWORD=MiContrasenaSeguraUsuario123!
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
    networks:
      - internal_network

  app:
    image: nextcloud:stable
    container_name: nextcloud-app
    restart: always
    ports:
      - "8080:80"
    volumes:
      - nextcloud_data:/var/www/html
    environment:
      - MYSQL_HOST=db
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=MiContrasenaSeguraUsuario123!
    depends_on:
      - db
    networks:
      - internal_network

volumes:
  db_data:
  nextcloud_data:

networks:
  internal_network:
    driver: bridge
