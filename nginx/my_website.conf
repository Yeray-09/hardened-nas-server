# 1. BLOQUE HTTP (Puerto 80): Redirección permanente a HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name 192.168.0.150;

    return 301 https://$host$request_uri;
}

# 2. BLOQUE HTTPS (Puerto 443): Proxy Inverso Seguro
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 192.168.0.150;

    # Certificados SSL
    ssl_certificate /etc/ssl/certs/nginx-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/nginx-selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Timeouts de seguridad
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 15s;

    # Tamaño máximo de subida de archivos (Ajustado a 512M para Nextcloud)
    client_max_body_size 512M;

    # Cabeceras de seguridad (Hardening)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    location / {
        # Rate Limiting
        limit_req zone=limite_ip burst=20 nodelay;

        # Redirección interna hacia el puerto 8080 de Nextcloud
        proxy_pass http://127.0.0.1:8080;

        # Cabeceras para trasladar la IP real del cliente al contenedor
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Desactivar buffering para mejorar el rendimiento de subida/descarga de archivos
        proxy_buffering off;
    }
}
